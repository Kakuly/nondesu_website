shortBio: "歌い手・作家・イラストレーターとして、可愛くて少し不思議な作品をつくっています。"
longBio: |
  のんです。歌と言葉と絵を行き来しながら、インターネットの友だちと一緒に作品を育てています。

  ゲーム風のシングルを出したり、イラストや文章の依頼も受けています。
  このサイトは、作品の棚と、遊べる部屋を兼ねた「おもちゃ箱」です。
roles:
  - 歌い手
  - 作家
  - イラストレーター
