# Decap CMS — production (Phase B)
# 1. YOUR_USER を GitHub の owner（ユーザー or org）に置き換える
# 2. Cloudflare Pages に GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET を設定
# 3. GitHub OAuth App の callback に {CMS origin}/api/callback を登録
backend:
  name: github
  repo: Kakuly/nondesu_website
  branch: main
  auth_endpoint: api/auth

local_backend: false

media_folder: public/assets/uploads
public_folder: /assets/uploads

# 公開サイト（プレビュー・リンク用）。CMS は /admin/ または admin サブドメイン
site_url: https://nondesu.com
display_url: https://nondesu.com

collections:
  - name: works
    label: ポートフォリオ
    folder: src/content/works
    extension: yaml
    format: yaml
    create: true
    slug: "{{slug}}"
    fields:
      - { label: タイトル, name: title, widget: string }
      - label: カテゴリ
        name: category
        widget: select
        options: [music, illustration, writing]
      - { label: タグ, name: tags, widget: list, default: [] }
      - { label: カバー画像, name: cover, widget: image, required: false }
      - { label: 概要, name: excerpt, widget: text, required: false }
      - { label: 注目作品, name: featured, widget: boolean, default: false }
      - { label: 日付, name: date, widget: datetime }
      - label: 埋め込み
        name: embed
        widget: object
        required: false
        fields:
          - { label: 種類, name: type, widget: select, options: [youtube, spotify, soundcloud] }
          - { label: ID, name: id, widget: string }
      - { label: ギャラリー, name: gallery, widget: list, required: false, field: { label: 画像, name: image, widget: image } }
      - label: リンク
        name: links
        widget: list
        fields:
          - { label: ラベル, name: label, widget: string }
          - { label: URL, name: url, widget: string }

  - name: profile
    label: プロフィール
    files:
      - label: のんです
        name: nondesu
        file: src/content/profile/nondesu.yaml
        fields:
          - { label: 短い紹介, name: shortBio, widget: text }
          - { label: 詳しい紹介, name: longBio, widget: text }
          - { label: 肩書き, name: roles, widget: list }
          - label: SNS
            name: sns
            widget: list
            fields:
              - { label: ラベル, name: label, widget: string }
              - { label: URL, name: url, widget: string }

  - name: releases
    label: リリース / EP
    folder: src/content/releases
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    fields:
      - { label: タイトル, name: title, widget: string }
      - { label: サブタイトル, name: subtitle, widget: string, required: false }
      - { label: URL スラッグ, name: slug, widget: string }
      - { label: カバー, name: cover, widget: image, required: false }
      - { label: 公開日, name: releaseDate, widget: datetime, required: false }
      - label: ゲーム
        name: game
        widget: select
        options: [collect]
        default: collect
      - label: リンク
        name: links
        widget: list
        fields:
          - { label: ラベル, name: label, widget: string }
          - { label: URL, name: url, widget: string }
      - { label: 本文, name: body, widget: markdown }

  - name: events
    label: 苺茶かのん イベント
    folder: src/content/events
    extension: yaml
    format: yaml
    create: true
    fields:
      - { label: タイトル, name: title, widget: string }
      - { label: 日付, name: date, widget: datetime }
      - { label: 場所, name: venue, widget: string, required: false }
      - { label: URL, name: url, widget: string, required: false }
      - label: 状態
        name: status
        widget: select
        options: [upcoming, past]
        default: upcoming

  - name: goods
    label: 苺茶かのん グッズ
    folder: src/content/goods
    extension: yaml
    format: yaml
    create: true
    fields:
      - { label: タイトル, name: title, widget: string }
      - { label: 価格, name: price, widget: string, required: false }
      - { label: 購入URL, name: url, widget: string, required: false }
      - { label: 画像, name: image, widget: image, required: false }
      - { label: 販売中, name: available, widget: boolean, default: true }
